<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="dsh-completion-notifier">
  <defs>
    <!-- Background Gradient (Deep Cosmic Blue) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e263d"/>
      <stop offset="50%" stop-color="#111625"/>
      <stop offset="100%" stop-color="#0b0e17"/>
    </linearGradient>

    <!-- Subtle Blue Radial Glow -->
    <radialGradient id="glow" cx="65%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#0a84ff" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#0a84ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0a84ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Bell Metallic Gradient -->
    <linearGradient id="bellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Accent / Chime Wave Gradient (Apple Blue to Cyan) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0a84ff"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect width="64" height="64" rx="14" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Sound Chime Waves (Top Right) -->
  <path d="M42 20c3.5 3 4.5 7.5 3.5 11" fill="none" stroke="url(#accentGrad)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M47 16c5.5 4.5 7 11.5 5 17" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Bell Handle (Top Loop) -->
  <path d="M30 18.5a2 2 0 1 1 4 0v1.5h-4z" fill="#94a3b8"/>

  <!-- Bell Body -->
  <path d="M32 20c-6.6 0-11 5-11 12.5 0 3.2-1.2 5.5-2.8 7.2-.6.7-.1 1.8.9 1.8h25.8c1 0 1.5-1.1.9-1.8-1.6-1.7-2.8-4-2.8-7.2 0-7.5-4.4-12.5-11-12.5z" fill="url(#bellGrad)"/>

  <!-- Bell Clapper (Bottom Rim & Bead) -->
  <path d="M28 41.5a4 4 0 0 0 8 0h-8z" fill="url(#accentGrad)"/>

  <!-- Subtle Completion Sparkle Dot -->
  <circle cx="44" cy="18" r="1.5" fill="#38bdf8"/>
</svg>