<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="notifier-smart-titler">
  <defs>
    <linearGradient id="titlerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241b35"/>
      <stop offset="50%" stop-color="#151022"/>
      <stop offset="100%" stop-color="#0a0812"/>
    </linearGradient>
    <radialGradient id="titlerGlow" cx="60%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f3e8ff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#titlerBg)"/>
  <rect width="64" height="64" rx="14" fill="url(#titlerGlow)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Chat Bubble Outline -->
  <path d="M18 20h22c4.4 0 8 3.6 8 8v4c0 4.4-3.6 8-8 8h-6l-7 6v-6h-9c-4.4 0-8-3.6-8-8v-4c0-4.4 3.6-8 8-8z" transform="translate(10, 2) scale(0.75)" fill="url(#bubbleGrad)"/>

  <!-- Magic Sparkle (Upper Right) -->
